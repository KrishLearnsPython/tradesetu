<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-2xl mx-auto py-8">
        <h1 class="text-2xl font-bold text-center mb-8">Multi-Step Form Navigation Test</h1>

        <!-- Step Indicators -->
        <div class="flex justify-center mb-8">
            <div class="flex items-center space-x-4">
                <div id="step-1-indicator" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">1</div>
                <div class="w-16 h-1 bg-gray-300"></div>
                <div id="step-2-indicator" class="w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm">2</div>
                <div class="w-16 h-1 bg-gray-300"></div>
                <div id="step-3-indicator" class="w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm">3</div>
            </div>
        </div>

        <!-- Step Content -->
        <div id="step-1" class="step-content bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Step 1: Account Information</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="email-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                    <input type="password" id="confirm_password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="confirm_password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="nextStep()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Next Step</button>
            </div>
        </div>

        <div id="step-2" class="step-content bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-xl font-semibold mb-4">Step 2: Business Information</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Owner Name</label>
                    <input type="text" id="owner_name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="owner_name-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Business Name</label>
                    <input type="text" id="business_name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="business_name-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
            </div>
            <div class="mt-6 flex justify-between">
                <button onclick="prevStep()" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">Previous</button>
                <button onclick="nextStep()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Next Step</button>
            </div>
        </div>

        <div id="step-3" class="step-content bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-xl font-semibold mb-4">Step 3: Additional Information</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Location</label>
                    <input type="text" id="location" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="location-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Stakeholder Type</label>
                    <select id="stakeholder" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="">Select type</option>
                        <option value="manufacturer">Manufacturer</option>
                        <option value="distributor">Distributor</option>
                        <option value="retailer">Retailer</option>
                    </select>
                    <div id="stakeholder-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">PAN/TAN ID</label>
                    <input type="text" id="pan_tan_id" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    <div id="pan_tan_id-error" class="text-red-500 text-sm mt-1 hidden"></div>
                </div>
            </div>
            <div class="mt-6 flex justify-between">
                <button onclick="prevStep()" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">Previous</button>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">Register</button>
            </div>
        </div>

        <!-- Debug Console -->
        <div class="mt-8 bg-black text-green-400 p-4 rounded-lg font-mono text-sm">
            <div class="font-bold mb-2">Debug Console:</div>
            <div id="debug-console"></div>
        </div>
    </div>

    <script>
// Global variable to track current step
let currentStep = 1;

// Function to show a specific step
function showStep(step) {
    log("Showing step: " + step);

    // Hide all steps
    document.querySelectorAll('.step-content').forEach(el => {
        el.classList.add('hidden');
    });

    // Show current step
    const currentStepDiv = document.getElementById('step-' + step);
    if (currentStepDiv) {
        currentStepDiv.classList.remove('hidden');
        log("Step " + step + " is now visible");
    } else {
        log("ERROR: Step " + step + " div not found");
    }

    // Update step indicators
    for (let i = 1; i <= 3; i++) {
        const indicator = document.getElementById('step-' + i + '-indicator');
        if (indicator) {
            if (i < step) {
                indicator.className = 'w-8 h-8 rounded-full bg-green-500 text-white font-bold flex items-center justify-center text-sm';
            } else if (i === step) {
                indicator.className = 'w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm';
            } else {
                indicator.className = 'w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm';
            }
        }
    }
}

// Function to validate current step
function validateCurrentStep() {
    log("Validating step: " + currentStep);
    let isValid = true;

    // Clear all errors first
    document.querySelectorAll('.step-content [id$="-error"]').forEach(errorDiv => {
        errorDiv.classList.add('hidden');
    });

    if (currentStep === 1) {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (!email) {
            showError('email', 'Email is required');
            isValid = false;
        } else if (!/\S+@\S+\.\S+/.test(email)) {
            showError('email', 'Please enter a valid email address');
            isValid = false;
        }

        if (!password) {
            showError('password', 'Password is required');
            isValid = false;
        } else if (password.length < 6) {
            showError('password', 'Password must be at least 6 characters');
            isValid = false;
        }

        if (!confirmPassword) {
            showError('confirm_password', 'Please confirm your password');
            isValid = false;
        } else if (password !== confirmPassword) {
            showError('confirm_password', 'Passwords do not match');
            isValid = false;
        }

    } else if (currentStep === 2) {
        const ownerName = document.getElementById('owner_name').value.trim();
        const businessName = document.getElementById('business_name').value.trim();

        if (!ownerName) {
            showError('owner_name', 'Owner name is required');
            isValid = false;
        }

        if (!businessName) {
            showError('business_name', 'Business name is required');
            isValid = false;
        }

    } else if (currentStep === 3) {
        const location = document.getElementById('location').value.trim();
        const stakeholder = document.getElementById('stakeholder').value;
        const panTan = document.getElementById('pan_tan_id').value.trim();

        if (!location) {
            showError('location', 'Location is required');
            isValid = false;
        }

        if (!stakeholder) {
            showError('stakeholder', 'Please select a stakeholder type');
            isValid = false;
        }

        if (!panTan) {
            showError('pan_tan_id', 'PAN/TAN ID is required');
            isValid = false;
        }
    }

    log("Validation result for step " + currentStep + ": " + isValid);
    return isValid;
}

// Function to go to next step
function nextStep() {
    log("nextStep() called, current step: " + currentStep);

    if (validateCurrentStep()) {
        if (currentStep < 3) {
            currentStep++;
            log("Moving to step: " + currentStep);
            showStep(currentStep);
        } else {
            log("Already on final step");
        }
    } else {
        log("Validation failed, staying on current step");
    }
}

// Function to go to previous step
function prevStep() {
    log("prevStep() called, current step: " + currentStep);

    if (currentStep > 1) {
        currentStep--;
        log("Moving to step: " + currentStep);
        showStep(currentStep);
    } else {
        log("Already on first step");
    }
}

// Function to show error message
function showError(elementId, message) {
    const errorDiv = document.getElementById(elementId + '-error');
    if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.classList.remove('hidden');
        log("Error shown for " + elementId + ": " + message);
    } else {
        log("ERROR: Error div not found for " + elementId);
    }
}

// Function to hide error message
function hideError(elementId) {
    const errorDiv = document.getElementById(elementId + '-error');
    if (errorDiv) {
        errorDiv.classList.add('hidden');
    }
}

// Debug logging function
function log(message) {
    const consoleDiv = document.getElementById('debug-console');
    const timestamp = new Date().toLocaleTimeString();
    consoleDiv.innerHTML += '[' + timestamp + '] ' + message + '<br>';
    console.log(message);
}

// Initialize first step when page loads
document.addEventListener('DOMContentLoaded', function() {
    log("Page loaded, initializing step 1");
    showStep(1);
});
</script>
</body>
</html>

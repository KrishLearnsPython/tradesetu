<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>TradeSetu</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#2563eb',
                        'brand-blue-hover': '#1d4ed8',
                    }
                }
            }
        }
    </script>

    <!-- Styles -->
    <style>
        

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>

<body class="min-h-screen">

    
   

    <!-- ✅ FLASH MESSAGES (UNCHANGED) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="fixed top-4 right-4 
                    {{ 'bg-red-600' if category == 'error' else 
                       'bg-green-600' if category == 'success' else 
                       'bg-blue-600' }} 
                    text-white p-4 rounded-lg shadow-lg z-50 fade-in">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- ✅ MAIN CONTENT (kept intact, just wrapped for layering) -->
    <div class="relative z-10">
        {% block content %}{% endblock %}
    </div>

</body>
</html>

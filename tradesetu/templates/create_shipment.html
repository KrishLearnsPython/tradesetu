{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-brand-blue hover:text-brand-blue-hover">TradeSetu</a>
                </div>
                <div class="flex items-center">
                    <a href="/dashboard" class="text-gray-700 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 py-6 sm:px-0">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">Create Shipment</h1>

            <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
                <form method="POST" action="{{ url_for('create_shipment') }}" class="space-y-6">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-6">
                        <label for="product_name" class="block text-lg font-medium text-gray-700 mb-2">Product Name</label>
                        <input type="text" id="product_name" name="product_name" required
                               class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div class="mb-6">
                        <label for="product_id" class="block text-lg font-medium text-gray-700 mb-2">Product ID</label>
                        <input type="text" id="product_id" name="product_id" required
                               class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label for="quantity" class="block text-lg font-medium text-gray-700 mb-2">Quantity</label>
                            <input type="number" id="quantity" name="quantity" required min="1"
                                   class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <div>
                            <label for="price_per_unit" class="block text-lg font-medium text-gray-700 mb-2">Price per Unit</label>
                            <input type="number" id="price_per_unit" name="price_per_unit" step="0.01" required min="0"
                                   class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>

                    <div class="mb-6">
                        <label for="total_price" class="block text-lg font-medium text-gray-700 mb-2">Total Price</label>
                        <input type="text" id="total_price" name="total_price" readonly
                               class="w-full px-4 py-3 text-lg bg-gray-50 border border-gray-300 rounded-lg">
                    </div>

                    <div class="border-t-2 pt-6 mt-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Delivery Information</h3>
                        
                        <div class="mb-6">
                            <label for="delivery_address" class="block text-lg font-medium text-gray-700 mb-2">Delivery Address</label>
                            <textarea id="delivery_address" name="delivery_address" required rows="3"
                                      class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                      placeholder="Enter complete delivery address"></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                            <div>
                                <label for="city" class="block text-lg font-medium text-gray-700 mb-2">City</label>
                                <input type="text" id="city" name="city" required
                                       class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                       placeholder="City">
                            </div>

                            <div>
                                <label for="state" class="block text-lg font-medium text-gray-700 mb-2">State</label>
                                <input type="text" id="state" name="state" required
                                       class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                       placeholder="State">
                            </div>

                            <div>
                                <label for="pincode" class="block text-lg font-medium text-gray-700 mb-2">Pincode</label>
                                <input type="text" id="pincode" name="pincode" required
                                       class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                       placeholder="Pincode">
                            </div>
                        </div>
                    </div>

                    <div class="border-t-2 pt-6 mt-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Select Target Retailer</h3>
                        
                        <div class="mb-6">
                            <label for="retailer_id" class="block text-lg font-medium text-gray-700 mb-2">Retailer</label>
                            <select id="retailer_id" name="retailer_id" required
                                    class="w-full px-4 py-3 text-lg border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Select a retailer</option>
                                {% for r in retailers %}
                                    <option value="{{ r.user_id }}">{{ r.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-6">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 text-lg rounded-lg hover:bg-blue-700 transition duration-200 font-medium">
                            Create Shipment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script>
    const quantityInput = document.getElementById('quantity');
    const priceInput = document.getElementById('price_per_unit');
    const totalPriceInput = document.getElementById('total_price');

    function calculateTotalPrice() {
        const quantity = parseFloat(quantityInput.value) || 0;
        const price = parseFloat(priceInput.value) || 0;
        totalPriceInput.value = (quantity * price).toFixed(2);
    }

    quantityInput.addEventListener('input', calculateTotalPrice);
    priceInput.addEventListener('input', calculateTotalPrice);
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="relative min-h-screen">

    <!-- ✅ Background Image -->
    <div class="absolute inset-0">
        <img src="{{ url_for('static', filename='images/bg.jpg') }}" 
             class="w-full h-full object-cover blur-[2px] scale-105" />

        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/60 to-black/80"></div>

        <!-- Optional blue tint -->
        <div class="absolute inset-0 bg-blue-900/30"></div>
    </div>

    <!-- ✅ Content -->
    <div class="relative z-10">

        <!-- NAVBAR (slightly adjusted for visibility) -->
        <nav class="bg-black/40 backdrop-blur-md border-b border-white/20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div>
                        <a href="/" class="text-white hover:text-blue-400 transition duration-300 font-medium">
                            ← TradeSetu
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- LOGIN SECTION -->
        <div class="min-h-screen flex items-center justify-center px-6">
            <div class="w-full max-w-md">

                <!-- ✅ KEEP YOUR ORIGINAL CARD DESIGN -->
                <div class="bg-white p-8 rounded-xl shadow-xl border border-gray-200">

                    <!-- Branding Header -->
                    <div class="text-center mb-6">
                        <h1 class="text-2xl font-bold text-gray-900 mb-1">
                            TradeSetu
                        </h1>
                        <p class="text-gray-600 text-xs">Connecting Trade. Securing Growth.</p>
                    </div>

                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-bold mb-2 text-gray-900">Welcome Back</h2>
                        <p class="text-gray-600">Sign in to your TradeSetu account</p>
                    </div>

                    <form method="POST" class="space-y-6">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">
                                Email Address
                            </label>
                            <input type="email" name="email" id="login-email"
                                class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg 
                                       focus:outline-none focus:ring-2 focus:ring-blue-500 
                                       focus:border-blue-500 transition-all" required>
                            <div id="login-email-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">
                                Password
                            </label>
                            <input type="password" name="password" id="login-password"
                                class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg 
                                       focus:outline-none focus:ring-2 focus:ring-blue-500 
                                       focus:border-blue-500 transition-all" required>
                            <div id="login-password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>

                        <button type="submit" id="login-submit"
                            class="w-full bg-blue-600 text-white py-3 rounded-lg 
                                   hover:bg-blue-700 transition-all duration-300 font-semibold">
                            Sign In
                        </button>
                    </form>

                    <div class="mt-6 text-center">
                        <p class="text-gray-600">
                            Don't have an account?
                            <a href="{{ url_for('register') }}"
                               class="text-blue-600 hover:text-blue-700 transition duration-300 font-semibold ml-1">
                                Create one
                            </a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- ✅ YOUR ORIGINAL SCRIPT (UNCHANGED) -->
<script>
document.getElementById('login-submit').addEventListener('click', function(e) {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    let hasError = false;

    hideError('login-email');
    hideError('login-password');

    if (!email) {
        showError('login-email', 'Email is required');
        hasError = true;
    } else if (!/\S+@\S+\.\S+/.test(email)) {
        showError('login-email', 'Please enter a valid email address');
        hasError = true;
    }

    if (!password) {
        showError('login-password', 'Password is required');
        hasError = true;
    }

    if (hasError) {
        e.preventDefault();
        return false;
    }
});

function showError(elementId, message) {
    const errorDiv = document.getElementById(elementId + '-error');
    errorDiv.textContent = message;
    errorDiv.classList.remove('hidden');
}

function hideError(elementId) {
    const errorDiv = document.getElementById(elementId + '-error');
    errorDiv.classList.add('hidden');
}
</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}
<!-- Global Navigation Bar -->
<nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center">
                <a href="/" class="text-gray-600 hover:text-blue-600 transition duration-300 font-medium">
                    ← TradeSetu
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="min-h-screen bg-gray-50 flex items-center justify-center px-6 py-8">
    <div class="w-full max-w-2xl">
        <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <!-- Branding Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">
                    TradeSetu
                </h1>
                <p class="text-gray-600 text-sm">Connecting Trade. Securing Growth.</p>
            </div>

            <!-- Step Indicator -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <div id="step-1-indicator" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">1</div>
                        <span class="ml-2 text-sm text-gray-600">Account</span>
                    </div>
                    <div class="w-8 h-0.5 bg-gray-300"></div>
                    <div class="flex items-center">
                        <div id="step-2-indicator" class="w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm">2</div>
                        <span class="ml-2 text-sm text-gray-500">Personal</span>
                    </div>
                    <div class="w-8 h-0.5 bg-gray-300"></div>
                    <div class="flex items-center">
                        <div id="step-3-indicator" class="w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm">3</div>
                        <span class="ml-2 text-sm text-gray-500">Business</span>
                    </div>
                </div>
            </div>

            <form id="registerForm" method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <!-- Step 1: Account Details -->
                <div id="step-1" class="step-content">
                    <h3 class="text-xl font-semibold mb-6 text-center text-blue-600">Create Your Account</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Email Address</label>
                            <input type="email" name="email" id="email" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                            <div id="email-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Password</label>
                            <input type="password" name="password" id="password" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                            <div id="password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Confirm Password</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                            <div id="confirm-password-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                    </div>
                    <button type="button" onclick="nextStep()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-all duration-300 font-semibold">
                        Next Step
                    </button>
                    <div class="mt-6 text-center">
                        <p class="text-gray-600">
                            Already have an account?
                            <a href="{{ url_for('login') }}" class="text-blue-600 hover:text-blue-700 transition duration-300 font-semibold ml-1">
                                Sign in here
                            </a>
                        </p>
                    </div>
                </div>

                <!-- Step 2: Personal Details -->
                <div id="step-2" class="step-content hidden">
                    <h3 class="text-xl font-semibold mb-6 text-center text-blue-600">Personal Information</h3>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Owner Name</label>
                            <input type="text" name="owner_name" id="owner_name" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                            <div id="owner-name-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Business Name</label>
                            <input type="text" name="business_name" id="business_name" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                            <div id="business-name-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                    </div>
                    <div class="flex space-x-4 mt-6">
                        <button type="button" onclick="prevStep()" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-400 transition-all duration-300 font-semibold">
                            Previous
                        </button>
                        <button type="button" onclick="nextStep()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-all duration-300 font-semibold">
                            Next Step
                        </button>
                    </div>
                </div>

                <!-- Step 3: Business Information -->
                <div id="step-3" class="step-content hidden">
                    <h3 class="text-xl font-semibold mb-6 text-center text-blue-600">Business Details</h3>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Location</label>
                            <input type="text" name="location" id="location" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                            <div id="location-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Stakeholder Type</label>
                            <select name="stakeholder" id="stakeholder" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                                <option value="">Select Type</option>
                                <option value="Manufacturer">Manufacturer</option>
                                <option value="Distributor">Distributor</option>
                                <option value="Storage">Storage</option>
                                <option value="Retailer">Retailer</option>
                            </select>
                            <div id="stakeholder-error" class="text-red-500 text-sm mt-1 hidden"></div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-semibold mb-2 text-gray-700">PAN/TAN ID</label>
                        <input type="text" name="pan_tan_id" id="pan_tan_id" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" required>
                        <div id="pan-tan-error" class="text-red-500 text-sm mt-1 hidden"></div>
                    </div>
                    <div class="flex space-x-4 mt-6">
                        <button type="button" onclick="prevStep()" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-400 transition-all duration-300 font-semibold">
                            Previous
                        </button>
                        <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-all duration-300 font-semibold">
                            Register
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Global variable to track current step
let currentStep = 1;

// Function to show a specific step
function showStep(step) {
    console.log("Showing step:", step);

    // Hide all steps
    document.querySelectorAll('.step-content').forEach(el => {
        el.classList.add('hidden');
    });

    // Show current step
    const currentStepDiv = document.getElementById('step-' + step);
    if (currentStepDiv) {
        currentStepDiv.classList.remove('hidden');
        console.log("Step", step, "is now visible");
    } else {
        console.error("Step", step, "div not found");
    }

    // Update step indicators
    for (let i = 1; i <= 3; i++) {
        const indicator = document.getElementById('step-' + i + '-indicator');
        if (indicator) {
            if (i < step) {
                indicator.className = 'w-8 h-8 rounded-full bg-green-500 text-white font-bold flex items-center justify-center text-sm';
            } else if (i === step) {
                indicator.className = 'w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm';
            } else {
                indicator.className = 'w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm';
            }
        }
    }

    // Update step text colors
    document.querySelectorAll('.step-text').forEach((el, index) => {
        if (index + 1 === step) {
            el.classList.remove('text-gray-500');
            el.classList.add('text-gray-900');
        } else {
            el.classList.remove('text-gray-900');
            el.classList.add('text-gray-500');
        }
    });
}

// Function to validate current step
function validateCurrentStep() {
    console.log("Validating step:", currentStep);
    let isValid = true;

    // Clear all errors first
    document.querySelectorAll('.step-content [id$="-error"]').forEach(errorDiv => {
        errorDiv.classList.add('hidden');
    });

    if (currentStep === 1) {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (!email) {
            showError('email', 'Email is required');
            isValid = false;
        } else if (!/\S+@\S+\.\S+/.test(email)) {
            showError('email', 'Please enter a valid email address');
            isValid = false;
        }

        if (!password) {
            showError('password', 'Password is required');
            isValid = false;
        } else if (password.length < 6) {
            showError('password', 'Password must be at least 6 characters');
            isValid = false;
        }

        if (!confirmPassword) {
            showError('confirm_password', 'Please confirm your password');
            isValid = false;
        } else if (password !== confirmPassword) {
            showError('confirm_password', 'Passwords do not match');
            isValid = false;
        }

    } else if (currentStep === 2) {
        const ownerName = document.getElementById('owner_name').value.trim();
        const businessName = document.getElementById('business_name').value.trim();

        if (!ownerName) {
            showError('owner_name', 'Owner name is required');
            isValid = false;
        }

        if (!businessName) {
            showError('business_name', 'Business name is required');
            isValid = false;
        }

    } else if (currentStep === 3) {
        const location = document.getElementById('location').value.trim();
        const stakeholder = document.getElementById('stakeholder').value;
        const panTan = document.getElementById('pan_tan_id').value.trim();

        if (!location) {
            showError('location', 'Location is required');
            isValid = false;
        }

        if (!stakeholder) {
            showError('stakeholder', 'Please select a stakeholder type');
            isValid = false;
        }

        if (!panTan) {
            showError('pan_tan_id', 'PAN/TAN ID is required');
            isValid = false;
        }
    }

    console.log("Validation result for step", currentStep, ":", isValid);
    return isValid;
}

// Function to go to next step
function nextStep() {
    console.log("nextStep() called, current step:", currentStep);

    if (validateCurrentStep()) {
        if (currentStep < 3) {
            currentStep++;
            console.log("Moving to step:", currentStep);
            showStep(currentStep);
        } else {
            console.log("Already on final step");
        }
    } else {
        console.log("Validation failed, staying on current step");
    }
}

// Function to go to previous step
function prevStep() {
    console.log("prevStep() called, current step:", currentStep);

    if (currentStep > 1) {
        currentStep--;
        console.log("Moving to step:", currentStep);
        showStep(currentStep);
    } else {
        console.log("Already on first step");
    }
}

// Function to show error message
function showError(elementId, message) {
    const errorDiv = document.getElementById(elementId + '-error');
    if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.classList.remove('hidden');
        console.log("Error shown for", elementId, ":", message);
    } else {
        console.error("Error div not found for", elementId);
    }
}

// Function to hide error message
function hideError(elementId) {
    const errorDiv = document.getElementById(elementId + '-error');
    if (errorDiv) {
        errorDiv.classList.add('hidden');
    }
}

// Initialize first step when page loads
document.addEventListener('DOMContentLoaded', function() {
    console.log("Page loaded, initializing step 1");
    showStep(1);
});
</script>
{% endblock %}

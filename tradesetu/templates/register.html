{% extends "base.html" %}

{% block content %}
<div class="relative min-h-screen">

    <!-- ✅ Background Image -->
    <div class="absolute inset-0">
        <img src="{{ url_for('static', filename='images/bg.jpg') }}" 
             class="w-full h-full object-cover blur-[2px] scale-105" />

        <!-- Gradient Overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/60 to-black/80"></div>

        <!-- Optional brand tint -->
        <div class="absolute inset-0 bg-blue-900/30"></div>
    </div>

    <!-- ✅ Content -->
    <div class="relative z-10">

        <!-- NAVBAR -->
        <nav class="bg-black/40 backdrop-blur-md border-b border-white/20">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex items-center h-16">
                    <a href="/" class="text-white hover:text-blue-400 transition font-medium">
                        ← TradeSetu
                    </a>
                </div>
            </div>
        </nav>

        <!-- REGISTER SECTION -->
        <div class="min-h-screen flex items-center justify-center px-6 py-8">
            <div class="w-full max-w-2xl">

                <!-- ✅ KEEP ORIGINAL FORM CARD -->
                <div class="bg-white p-8 rounded-xl shadow-xl border border-gray-200">

                    <!-- Branding Header -->
                    <div class="text-center mb-8">
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">
                            TradeSetu
                        </h1>
                        <p class="text-gray-600 text-sm">Connecting Trade. Securing Growth.</p>
                    </div>

                    <!-- Step Indicator -->
                    <div class="flex justify-center mb-8">
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center">
                                <div id="step-1-indicator" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">1</div>
                                <span class="ml-2 text-sm text-gray-600">Account</span>
                            </div>
                            <div class="w-8 h-0.5 bg-gray-300"></div>
                            <div class="flex items-center">
                                <div id="step-2-indicator" class="w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm">2</div>
                                <span class="ml-2 text-sm text-gray-500">Personal</span>
                            </div>
                            <div class="w-8 h-0.5 bg-gray-300"></div>
                            <div class="flex items-center">
                                <div id="step-3-indicator" class="w-8 h-8 rounded-full bg-gray-300 text-gray-500 font-bold flex items-center justify-center text-sm">3</div>
                                <span class="ml-2 text-sm text-gray-500">Business</span>
                            </div>
                        </div>
                    </div>

                    <form id="registerForm" method="POST" class="space-y-6">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                        <!-- STEP 1 -->
                        <div id="step-1" class="step-content">
                            <h3 class="text-xl font-semibold mb-6 text-center text-blue-600">Create Your Account</h3>

                            <div class="space-y-4">
                                <input type="email" name="email" id="email"
                                    placeholder="Email Address"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>

                                <input type="password" name="password" id="password"
                                    placeholder="Password"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>

                                <input type="password" name="confirm_password" id="confirm_password"
                                    placeholder="Confirm Password"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>

                                <div id="email-error" class="text-red-500 text-sm hidden"></div>
                                <div id="password-error" class="text-red-500 text-sm hidden"></div>
                                <div id="confirm_password-error" class="text-red-500 text-sm hidden"></div>
                            </div>

                            <button type="button" onclick="nextStep()"
                                class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-semibold">
                                Next Step
                            </button>
                        </div>

                        <!-- STEP 2 -->
                        <div id="step-2" class="step-content hidden">
                            <h3 class="text-xl font-semibold mb-6 text-center text-blue-600">Personal Information</h3>

                            <div class="grid md:grid-cols-2 gap-4">
                                <input type="text" name="owner_name" id="owner_name"
                                    placeholder="Owner Name"
                                    class="px-4 py-3 border border-gray-300 rounded-lg" required>

                                <input type="text" name="business_name" id="business_name"
                                    placeholder="Business Name"
                                    class="px-4 py-3 border border-gray-300 rounded-lg" required>
                            </div>

                            <div class="flex gap-4 mt-6">
                                <button type="button" onclick="prevStep()" class="flex-1 bg-gray-300 py-3 rounded-lg">
                                    Previous
                                </button>
                                <button type="button" onclick="nextStep()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg">
                                    Next Step
                                </button>
                            </div>
                        </div>

                        <!-- STEP 3 -->
                        <div id="step-3" class="step-content hidden">
                            <h3 class="text-xl font-semibold mb-6 text-center text-blue-600">Business Details</h3>

                            <div class="grid md:grid-cols-2 gap-4">
                                <input type="text" name="location" id="location"
                                    placeholder="Location"
                                    class="px-4 py-3 border border-gray-300 rounded-lg" required>

                                <select name="stakeholder" id="stakeholder"
                                    class="px-4 py-3 border border-gray-300 rounded-lg" required>
                                    <option value="">Select Type</option>
                                    <option value="Manufacturer">Manufacturer</option>
                                    <option value="Distributor">Distributor</option>
                                    <option value="Storage">Storage</option>
                                    <option value="Retailer">Retailer</option>
                                </select>
                            </div>

                            <input type="text" name="pan_tan_id" id="pan_tan_id"
                                placeholder="PAN/TAN ID"
                                class="w-full mt-4 px-4 py-3 border border-gray-300 rounded-lg" required>

                            <div class="flex gap-4 mt-6">
                                <button type="button" onclick="prevStep()" class="flex-1 bg-gray-300 py-3 rounded-lg">
                                    Previous
                                </button>
                                <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg">
                                    Register
                                </button>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ✅ KEEP YOUR ORIGINAL SCRIPT (UNCHANGED) -->
<script>
let currentStep = 1;

function showStep(step) {
    document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
    document.getElementById('step-' + step).classList.remove('hidden');
}

function nextStep() {
    if (currentStep < 3) {
        currentStep++;
        showStep(currentStep);
    }
}

function prevStep() {
    if (currentStep > 1) {
        currentStep--;
        showStep(currentStep);
    }
}

document.addEventListener('DOMContentLoaded', () => showStep(1));
</script>

{% endblock %}
